<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc"><title id="title">Vom Thema zur belegten Seitenentscheidung</title><desc id="desc">Eigene Ablaufgrafik. Ein kurzes Thema führt zur Wahl zwischen nativer API-Beobachtung und modelliertem Plan. Belege und Nachfrageprüfung gehen der Seitenentscheidung voraus.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#93afb7"/></marker></defs><rect width="640" height="1000" fill="#080d10"/><text x="40" y="42" fill="#a0b1b9" font-family="Arial,sans-serif" font-size="28">EIGENER LEHRABLAUF</text><rect x="40" y="70" width="560" height="112" rx="8" fill="#111a1e" stroke="#e6eeee" stroke-width="2"/><text x="65" y="116" fill="#e6eeee" font-family="Arial,sans-serif" font-size="28">1 · Thema: best SEO tools</text><text x="65" y="154" fill="#e6eeee" font-family="Arial,sans-serif" font-size="28">Leser: kleines Rechercheteam</text><path d="M320 183V220" stroke="#93afb7" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="258" fill="#e6eeee" font-family="Arial,sans-serif" font-size="28">2 · Passenden Modus wählen</text><rect x="40" y="286" width="560" height="128" rx="8" fill="#111a1e" stroke="#4eb4cb" stroke-width="2"/><text x="65" y="332" fill="#4eb4cb" font-family="Arial,sans-serif" font-size="28">Native API-Beobachtung</text><text x="65" y="370" fill="#4eb4cb" font-family="Arial,sans-serif" font-size="28">Nur offengelegte Felder erhalten</text><text x="280" y="453" fill="#a0b1b9" font-family="Arial,sans-serif" font-size="28">ODER</text><rect x="40" y="478" width="560" height="128" rx="8" fill="#111a1e" stroke="#d3a574" stroke-width="2"/><text x="65" y="524" fill="#d3a574" font-family="Arial,sans-serif" font-size="28">Modellierter Rechercheplan</text><text x="65" y="562" fill="#d3a574" font-family="Arial,sans-serif" font-size="28">Ideen, noch keine Beobachtung</text><path d="M40 350H20V634H320V650" stroke="#93afb7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M40 542H20" stroke="#93afb7" stroke-width="3" fill="none"/><rect x="40" y="674" width="560" height="112" rx="8" fill="#111a1e" stroke="#e6eeee" stroke-width="2"/><text x="65" y="720" fill="#e6eeee" font-family="Arial,sans-serif" font-size="28">3 · Belege und Nachfrage prüfen</text><text x="65" y="758" fill="#e6eeee" font-family="Arial,sans-serif" font-size="28">Fehlende Daten bleiben offen</text><path d="M320 787V830" stroke="#93afb7" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="854" width="560" height="112" rx="8" fill="#111a1e" stroke="#4eb4cb" stroke-width="2"/><text x="65" y="900" fill="#4eb4cb" font-family="Arial,sans-serif" font-size="28">4 · Seite ergänzen oder planen</text><text x="65" y="938" fill="#4eb4cb" font-family="Arial,sans-serif" font-size="28">Leseraufgabe und Scope erhalten</text></svg>
