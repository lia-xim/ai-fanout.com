<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc"><title id="title">Selection and inspectable handoff</title><desc id="desc">Selection retains original run context and domain scope. No query/source join is added.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#50d9ad" stroke-width="1.5"/></marker></defs><rect width="640" height="1000" fill="#10191d"/><rect x="28" y="26" width="584" height="160" rx="10" fill="#19272c" stroke="#427065"/><text x="52" y="70" fill="#e6f3ed" font-family="Arial,sans-serif" font-size="29" font-weight="700">Published original run</text><text x="52" y="117" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">4 strings · completed · en/US</text><text x="52" y="157" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">27 August 2026 · 13 domains</text><path d="M320 190 V214" stroke="#50d9ad" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="223" width="584" height="160" rx="10" fill="#19272c" stroke="#427065"/><text x="52" y="267" fill="#e6f3ed" font-family="Arial,sans-serif" font-size="29" font-weight="700">Selected pricing queries</text><text x="52" y="314" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">Ahrefs pricing official</text><text x="52" y="354" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">Semrush pricing official</text><path d="M320 387 V411" stroke="#50d9ad" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="420" width="584" height="160" rx="10" fill="#19272c" stroke="#427065"/><text x="52" y="464" fill="#e6f3ed" font-family="Arial,sans-serif" font-size="29" font-weight="700">Versioned handoff</text><text x="52" y="511" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">JSON in URL fragment</text><text x="52" y="551" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">No new source URLs</text><path d="M320 584 V608" stroke="#50d9ad" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="617" width="584" height="160" rx="10" fill="#19272c" stroke="#427065"/><text x="52" y="661" fill="#e6f3ed" font-family="Arial,sans-serif" font-size="29" font-weight="700">Local analysis</text><text x="52" y="708" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">2 queries · 13 original domains</text><text x="52" y="748" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">One pricing assignment</text><path d="M320 781 V805" stroke="#50d9ad" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="814" width="584" height="160" rx="10" fill="#19272c" stroke="#427065"/><text x="52" y="858" fill="#e6f3ed" font-family="Arial,sans-serif" font-size="29" font-weight="700">Manual acceptance</text><text x="52" y="905" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">Demand · existing page</text><text x="52" y="945" fill="#c0d5ce" font-family="Arial,sans-serif" font-size="26">Check source fit separately</text></svg>
